[project]
name = "aoc-2023"
version = "2023.15.0"
description = "Advent of Code 2023"
authors = [{ name = "Ian Glover", email = "ian.glover@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "bs4>=0.0.1,<0.0.2",
    "ipython>=8.18.1,<9.0.0",
    "pytest>=7.4.3,<8.0.0",
    "numpy>=1.26.2,<2.0.0",
    "pre-commit>=3.6.0,<4.0.0",
    "flake8>=6.1.0,<7.0.0",
]

[project.urls]
homepage = "https://github.com/manicai/advent_of_code_2023"

[tool.poetry]
packages = [{ include = "aoc" }]

[tool.poetry.group.dev.dependencies]
pylint = "^3.0.2"
flake8 = "^6.1.0"
black = "^23.11.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
